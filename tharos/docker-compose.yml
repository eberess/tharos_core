services:
  tharos-engine:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./workspace:/workspace
    environment:
      - THAROS_LLM_BACKEND=ollama
      - THAROS_MODEL=qwen2.5-coder:7b
    devices:
      - /dev/nvidia0:/dev/nvidia0
    networks:
      - tharos-net

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    volumes:
      - ./workspace:/workspace
    networks:
      - tharos-net
    profiles:
      - test

networks:
  tharos-net:
    driver: bridge
