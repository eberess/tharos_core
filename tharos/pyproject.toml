[project]
name = "tharos-core"
version = "0.1.0"
description = "Moteur de Migration & Résolution de Dette Technique"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.23.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.12.0",
    "docker>=7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gpu = [
    "vllm>=0.6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[project.scripts]
tharos = "tharos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tharos"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
