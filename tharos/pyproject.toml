[project]
name = "tharos-core"
version = "0.1.0"
description = "Moteur de Migration & Résolution de Dette Technique"
license = {text = "Proprietary"}
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "docker>=7.0",
    "networkx>=3.3",
    "requests>=2.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
tharos = "tharos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tharos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=tharos --cov-report=term-missing"
